services:
  # Vector database backing the RAG retrieval index (Qdrant).
  qdrant:
    image: qdrant/qdrant:v1.13.3
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # Evaluation harness. Runs the full evaluation (both RAG pipelines,
  # LLM judge, regression report) and validates the produced artifacts.
  rag_harness:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./results:/app/results
      - ./dataset:/app/dataset:ro
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
    environment:
      - RAG_JUDGE_MODE=deterministic
      - LLM_API_KEY=${LLM_API_KEY:-}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=acme_knowledge_base
    healthcheck:
      test: ["CMD", "python", "-m", "src.healthcheck"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  qdrant_storage: